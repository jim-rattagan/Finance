<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lots — CEDEAR Tracker</title>
<style>
  :root {
    --bg: #0f1410;
    --panel: #161d18;
    --panel-2: #1c241e;
    --line: #2a352c;
    --ink: #e8ede9;
    --ink-dim: #8fa092;
    --ink-faint: #5b6b5e;
    --accent: #d4a441;
    --up: #4caf7d;
    --down: #d4634a;
    --mono: 'JetBrains Mono', 'SF Mono', Consolas, monospace;
    --sans: 'Inter', -apple-system, sans-serif;
    --radius: 3px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.5;
    padding: 0;
    min-height: 100vh;
  }

  header {
    border-bottom: 1px solid var(--line);
    padding: 20px 28px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }

  .brand {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }

  .brand-mark {
    font-family: var(--mono);
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  .brand-mark .dim { color: var(--ink-faint); font-weight: 400; }

  .brand-sub {
    font-size: 11px;
    color: var(--ink-faint);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .header-actions {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 28px;
  }

  .stats-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 1px;
    background: var(--line);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
    margin-bottom: 28px;
  }

  .stat {
    background: var(--panel);
    padding: 14px 18px;
  }

  .stat-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-faint);
    margin-bottom: 6px;
  }

  .stat-value {
    font-family: var(--mono);
    font-size: 20px;
    font-weight: 600;
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    margin-bottom: 20px;
  }

  .panel-head {
    padding: 14px 18px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .panel-title {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-dim);
    font-weight: 600;
  }

  .panel-body { padding: 18px; }

  .form-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 12px;
    align-items: end;
  }

  .field label {
    display: block;
    font-size: 11px;
    color: var(--ink-faint);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 6px;
  }

  input, select {
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--ink);
    padding: 9px 10px;
    border-radius: var(--radius);
    font-family: var(--mono);
    font-size: 13px;
  }

  input:focus, select:focus {
    outline: none;
    border-color: var(--accent);
  }

  input::placeholder { color: var(--ink-faint); }

  button {
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 600;
    padding: 9px 16px;
    border-radius: var(--radius);
    border: 1px solid var(--line);
    background: var(--panel-2);
    color: var(--ink);
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }

  button:hover { border-color: var(--ink-faint); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .btn-buy {
    background: rgba(76, 175, 125, 0.12);
    border-color: rgba(76, 175, 125, 0.4);
    color: var(--up);
  }
  .btn-buy:hover { background: rgba(76, 175, 125, 0.2); }

  .btn-sell {
    background: rgba(212, 99, 74, 0.12);
    border-color: rgba(212, 99, 74, 0.4);
    color: var(--down);
  }
  .btn-sell:hover { background: rgba(212, 99, 74, 0.2); }

  .btn-ghost {
    background: transparent;
    color: var(--ink-dim);
    font-size: 12px;
    padding: 7px 12px;
  }

  .tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 20px;
    border-bottom: 1px solid var(--line);
  }

  .tab {
    padding: 10px 16px;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-faint);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    user-select: none;
  }

  .tab.active { color: var(--ink); border-bottom-color: var(--accent); }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  table {
    width: 100%;
    border-collapse: collapse;
    font-family: var(--mono);
    font-size: 13px;
  }

  thead th {
    text-align: left;
    font-family: var(--sans);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-faint);
    font-weight: 600;
    padding: 8px 12px;
    border-bottom: 1px solid var(--line);
  }

  tbody tr {
    border-bottom: 1px solid var(--line);
  }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: rgba(255,255,255,0.02); }

  td {
    padding: 10px 12px;
    vertical-align: top;
  }

  .ticker-cell {
    font-family: var(--sans);
    font-weight: 700;
    font-size: 13px;
  }

  .status {
    display: inline-block;
    font-family: var(--sans);
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 3px 8px;
    border-radius: 20px;
  }

  .status-open { background: rgba(76,175,125,0.14); color: var(--up); }
  .status-partial { background: rgba(212,164,65,0.14); color: var(--accent); }
  .status-closed { background: rgba(139,148,158,0.14); color: var(--ink-faint); }

  .sell-history {
    margin-top: 6px;
    padding-left: 10px;
    border-left: 2px solid var(--line);
  }

  .sell-line {
    font-size: 11px;
    color: var(--ink-dim);
    padding: 2px 0;
  }

  .empty-state {
    text-align: center;
    padding: 48px 20px;
    color: var(--ink-faint);
  }

  .empty-state-title {
    font-family: var(--mono);
    font-size: 14px;
    color: var(--ink-dim);
    margin-bottom: 6px;
  }

  .fifo-note {
    font-size: 11px;
    color: var(--ink-faint);
    margin-top: 8px;
    padding: 8px 10px;
    background: var(--panel-2);
    border-radius: var(--radius);
    border-left: 2px solid var(--accent);
  }

  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--ink);
    padding: 10px 18px;
    border-radius: var(--radius);
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
    z-index: 100;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  #importFile { display: none; }

  @media (max-width: 640px) {
    header { padding: 16px; }
    main { padding: 16px; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-mark">LOTS<span class="dim">.log</span></div>
    <div class="brand-sub">CEDEAR position tracker — INVIU</div>
  </div>
  <div class="header-actions">
    <button class="btn-ghost" onclick="exportData()">Export JSON</button>
    <button class="btn-ghost" onclick="document.getElementById('importFile').click()">Import JSON</button>
    <input type="file" id="importFile" accept="application/json" onchange="importData(event)">
  </div>
</header>

<main>

  <div class="stats-row" id="statsRow"></div>

  <div class="tabs">
    <div class="tab active" data-tab="buy" onclick="switchTab('buy')">Register buy</div>
    <div class="tab" data-tab="sell" onclick="switchTab('sell')">Register sell</div>
  </div>

  <div class="tab-panel active" id="tab-buy">
    <div class="panel">
      <div class="panel-head"><div class="panel-title">New lot</div></div>
      <div class="panel-body">
        <div class="form-grid">
          <div class="field">
            <label>Ticker</label>
            <input id="buyTicker" placeholder="MELI" style="text-transform:uppercase">
          </div>
          <div class="field">
            <label>Date</label>
            <input id="buyDate" type="date">
          </div>
          <div class="field">
            <label>Quantity</label>
            <input id="buyQty" type="number" step="any" placeholder="10">
          </div>
          <div class="field">
            <label>Price (ARS)</label>
            <input id="buyPrice" type="number" step="any" placeholder="18500">
          </div>
          <div class="field">
            <button class="btn-buy" style="width:100%" onclick="registerBuy()">Add lot</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="tab-panel" id="tab-sell">
    <div class="panel">
      <div class="panel-head"><div class="panel-title">Register sell</div></div>
      <div class="panel-body">
        <div class="form-grid">
          <div class="field">
            <label>Ticker</label>
            <input id="sellTicker" placeholder="MELI" style="text-transform:uppercase" oninput="refreshLotOverride()">
          </div>
          <div class="field">
            <label>Date</label>
            <input id="sellDate" type="date">
          </div>
          <div class="field">
            <label>Quantity</label>
            <input id="sellQty" type="number" step="any" placeholder="5" oninput="refreshLotOverride()">
          </div>
          <div class="field">
            <label>Price (ARS)</label>
            <input id="sellPrice" type="number" step="any" placeholder="19200">
          </div>
        </div>
        <div class="form-grid" style="margin-top:12px">
          <div class="field" style="grid-column: span 2">
            <label>Lot to close (default: oldest / FIFO)</label>
            <select id="lotOverride"><option value="fifo">Auto — FIFO (oldest first)</option></select>
          </div>
          <div class="field">
            <button class="btn-sell" style="width:100%" onclick="registerSell()">Register sell</button>
          </div>
        </div>
        <div class="fifo-note" id="fifoPreview">Enter a ticker and quantity to preview which lot(s) will be affected.</div>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-head">
      <div class="panel-title">Lots</div>
      <div style="font-size:11px;color:var(--ink-faint)" id="lotCount"></div>
    </div>
    <div class="panel-body" id="lotsContainer" style="padding:0; overflow-x:auto"></div>
  </div>

</main>

<div class="toast" id="toast"></div>

<script>
  const STORAGE_KEY = 'lots_tracker_v1';
  let lots = [];

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      lots = raw ? JSON.parse(raw) : [];
    } catch (e) {
      lots = [];
    }
  }

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(lots));
  }

  function uid() {
    return 'lot_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
  }

  function remainingQty(lot) {
    const sold = lot.sells.reduce((s, x) => s + x.qty, 0);
    return +(lot.buyQty - sold).toFixed(6);
  }

  function lotStatus(lot) {
    const r = remainingQty(lot);
    if (r <= 0) return 'closed';
    if (r < lot.buyQty) return 'partial';
    return 'open';
  }

  function switchTab(name) {
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === 'tab-' + name));
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2200);
  }

  function registerBuy() {
    const ticker = document.getElementById('buyTicker').value.trim().toUpperCase();
    const date = document.getElementById('buyDate').value;
    const qty = parseFloat(document.getElementById('buyQty').value);
    const price = parseFloat(document.getElementById('buyPrice').value);

    if (!ticker || !date || !qty || qty <= 0 || !price || price <= 0) {
      showToast('Complete all fields with valid values.');
      return;
    }

    lots.push({
      id: uid(),
      ticker,
      buyDate: date,
      buyQty: qty,
      buyPrice: price,
      sells: []
    });
    save();
    render();
    document.getElementById('buyTicker').value = '';
    document.getElementById('buyQty').value = '';
    document.getElementById('buyPrice').value = '';
    showToast(`Lot added: ${ticker} x${qty}`);
  }

  function openLotsForTicker(ticker) {
    return lots
      .filter(l => l.ticker === ticker && remainingQty(l) > 0)
      .sort((a, b) => new Date(a.buyDate) - new Date(b.buyDate));
  }

  function refreshLotOverride() {
    const ticker = document.getElementById('sellTicker').value.trim().toUpperCase();
    const qty = parseFloat(document.getElementById('sellQty').value) || 0;
    const sel = document.getElementById('lotOverride');
    const preview = document.getElementById('fifoPreview');

    sel.innerHTML = '<option value="fifo">Auto — FIFO (oldest first)</option>';

    if (!ticker) {
      preview.textContent = 'Enter a ticker and quantity to preview which lot(s) will be affected.';
      return;
    }

    const openLots = openLotsForTicker(ticker);
    if (openLots.length === 0) {
      preview.textContent = `No open lots found for ${ticker}.`;
      return;
    }

    openLots.forEach(l => {
      const opt = document.createElement('option');
      opt.value = l.id;
      opt.textContent = `${l.buyDate} — remaining ${remainingQty(l)} @ ARS ${l.buyPrice}`;
      sel.appendChild(opt);
    });

    if (qty > 0) {
      const chain = fifoPreviewChain(openLots, qty);
      preview.innerHTML = 'FIFO would apply: ' + chain.map(c =>
        `<b>${c.qty}</b> from lot opened <b>${c.lot.buyDate}</b>`
      ).join(', ') + (chain.reduce((s,c)=>s+c.qty,0) < qty ? ' <span style="color:var(--down)">— insufficient open quantity!</span>' : '');
    } else {
      preview.textContent = `${openLots.length} open lot(s) found for ${ticker}.`;
    }
  }

  function fifoPreviewChain(openLots, qty) {
    let remaining = qty;
    const chain = [];
    for (const lot of openLots) {
      if (remaining <= 0) break;
      const avail = remainingQty(lot);
      const take = Math.min(avail, remaining);
      if (take > 0) {
        chain.push({ lot, qty: take });
        remaining -= take;
      }
    }
    return chain;
  }

  function registerSell() {
    const ticker = document.getElementById('sellTicker').value.trim().toUpperCase();
    const date = document.getElementById('sellDate').value;
    const qty = parseFloat(document.getElementById('sellQty').value);
    const price = parseFloat(document.getElementById('sellPrice').value);
    const override = document.getElementById('lotOverride').value;

    if (!ticker || !date || !qty || qty <= 0 || !price || price <= 0) {
      showToast('Complete all fields with valid values.');
      return;
    }

    let targets;
    if (override === 'fifo') {
      const openLots = openLotsForTicker(ticker);
      targets = fifoPreviewChain(openLots, qty);
    } else {
      const lot = lots.find(l => l.id === override);
      if (!lot) { showToast('Selected lot not found.'); return; }
      const avail = remainingQty(lot);
      if (avail < qty) {
        showToast(`Selected lot only has ${avail} remaining, cannot sell ${qty}.`);
        return;
      }
      targets = [{ lot, qty }];
    }

    const totalAvail = targets.reduce((s, t) => s + t.qty, 0);
    if (totalAvail < qty) {
      showToast(`Not enough open quantity for ${ticker}. Only ${totalAvail} available.`);
      return;
    }

    targets.forEach(t => {
      t.lot.sells.push({ date, qty: t.qty, price });
    });

    save();
    render();
    document.getElementById('sellTicker').value = '';
    document.getElementById('sellQty').value = '';
    document.getElementById('sellPrice').value = '';
    refreshLotOverride();
    showToast(`Sell registered: ${ticker} x${qty} across ${targets.length} lot(s)`);
  }

  function deleteLot(id) {
    if (!confirm('Delete this lot and its sell history? This cannot be undone.')) return;
    lots = lots.filter(l => l.id !== id);
    save();
    render();
  }

  function exportData() {
    const blob = new Blob([JSON.stringify(lots, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `lots_export_${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
    showToast('Exported.');
  }

  function importData(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const parsed = JSON.parse(e.target.result);
        if (!Array.isArray(parsed)) throw new Error('Invalid format');
        if (lots.length > 0 && !confirm('This will replace your current data. Continue?')) return;
        lots = parsed;
        save();
        render();
        showToast('Imported successfully.');
      } catch (err) {
        showToast('Import failed: invalid JSON file.');
      }
    };
    reader.readAsText(file);
    event.target.value = '';
  }

  function fmt(n) {
    return new Intl.NumberFormat('es-AR', { maximumFractionDigits: 2 }).format(n);
  }

  function fmtUsd(n) {
    if (n === null || n === undefined || isNaN(n)) return '—';
    return 'US$ ' + new Intl.NumberFormat('en-US', { maximumFractionDigits: 2 }).format(n);
  }

  // A lot carries enriched USD fields only if it came from transform_inviu.py
  // (or was manually enriched). Manually-added lots via the form won't have
  // these -- treated as "—" rather than assumed zero.
  function hasUsdData(lot) {
    return lot.usdInvested !== undefined && lot.usdInvested !== null;
  }

  function renderStats() {
    const totalLots = lots.length;
    const openCount = lots.filter(l => lotStatus(l) !== 'closed').length;
    const tickers = new Set(lots.map(l => l.ticker)).size;
    const investedOpenArs = lots.reduce((sum, l) => sum + remainingQty(l) * l.buyPrice, 0);

    const usdLots = lots.filter(hasUsdData);
    const investedOpenUsd = usdLots.reduce((sum, l) => {
      const openFraction = l.buyQty ? remainingQty(l) / l.buyQty : 0;
      return sum + l.usdInvested * openFraction;
    }, 0);

    const stats = [
      { label: 'Total lots', value: totalLots },
      { label: 'Open / partial', value: openCount },
      { label: 'Tickers', value: tickers },
      { label: 'Open cost basis (ARS)', value: fmt(investedOpenArs) },
      { label: 'Open cost basis (USD)', value: usdLots.length ? fmtUsd(investedOpenUsd) : '—' }
    ];

    document.getElementById('statsRow').innerHTML = stats.map(s =>
      `<div class="stat"><div class="stat-label">${s.label}</div><div class="stat-value">${s.value}</div></div>`
    ).join('');
  }

  function render() {
    renderStats();
    refreshLotOverride();

    const container = document.getElementById('lotsContainer');
    document.getElementById('lotCount').textContent = lots.length + ' lot(s)';

    if (lots.length === 0) {
      container.innerHTML = `<div class="empty-state">
        <div class="empty-state-title">No lots yet</div>
        <div>Register your first buy above to start tracking.</div>
      </div>`;
      return;
    }

    const sorted = [...lots].sort((a, b) => {
      if (a.ticker !== b.ticker) return a.ticker.localeCompare(b.ticker);
      return new Date(b.buyDate) - new Date(a.buyDate);
    });

    let html = `<table><thead><tr>
      <th>Ticker</th><th>Underlying</th><th>Buy date</th><th>Qty</th><th>Buy price (ARS)</th>
      <th>USD invested</th><th>Implied UNDL price</th>
      <th>Remaining</th><th>Status</th><th></th>
    </tr></thead><tbody>`;

    sorted.forEach(lot => {
      const rem = remainingQty(lot);
      const status = lotStatus(lot);
      const hasUsd = hasUsdData(lot);

      const sellsHtml = lot.sells.length
        ? `<div class="sell-history">${lot.sells.map(s => {
            const usdBit = (s.usdReceived !== undefined && s.usdReceived !== null)
              ? ` · ${fmtUsd(s.usdReceived)}` : '';
            return `<div class="sell-line">− ${fmt(s.qty)} @ ARS ${fmt(s.price)} on ${s.date}${usdBit}</div>`;
          }).join('')}</div>`
        : '';

      const underlyingCell = lot.underlyingTicker && lot.underlyingTicker !== lot.ticker
        ? `${lot.underlyingTicker}<div style="font-size:10px;color:var(--ink-faint)">ratio ${lot.ratio}:1</div>`
        : (lot.underlyingTicker || '—');

      const cclNote = hasUsd && lot.buyCCL
        ? `<div style="font-size:10px;color:var(--ink-faint)">CCL ${fmt(lot.buyCCL)}${lot.buyCCLDateUsed && lot.buyCCLDateUsed !== lot.buyDate ? ' (' + lot.buyCCLDateUsed + ')' : ''}</div>`
        : '';

      html += `<tr>
        <td class="ticker-cell">${lot.ticker}</td>
        <td>${underlyingCell}</td>
        <td>${lot.buyDate}</td>
        <td>${fmt(lot.buyQty)}</td>
        <td>${fmt(lot.buyPrice)}</td>
        <td>${hasUsd ? fmtUsd(lot.usdInvested) : '—'}${cclNote}</td>
        <td>${hasUsd && lot.impliedUnderlyingPriceUSD ? fmtUsd(lot.impliedUnderlyingPriceUSD) : '—'}</td>
        <td>${fmt(rem)}${sellsHtml}</td>
        <td><span class="status status-${status}">${status}</span></td>
        <td><button class="btn-ghost" onclick="deleteLot('${lot.id}')">Delete</button></td>
      </tr>`;
    });

    html += '</tbody></table>';
    container.innerHTML = html;
  }

  load();
  render();
</script>

</body>
</html>
